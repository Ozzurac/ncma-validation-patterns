name: Python validation examples

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit and failure-path tests
        run: python -m unittest discover -s tests -v
      - name: Synthetic demo
        run: python -m examples.demo
      - name: Compile
        run: python -m compileall -q validation_patterns examples tests